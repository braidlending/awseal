name: Build development artifact

# Deliberately manual: unsigned artifacts are not production releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test
        run: |
          swift --version
          swift test --scratch-path "$RUNNER_TEMP/awseal-tests"
          swift build -c release --scratch-path "$RUNNER_TEMP/awseal-release" --arch arm64
          swift build -c release --scratch-path "$RUNNER_TEMP/awseal-release" --arch x86_64
          mkdir -p "$RUNNER_TEMP/awseal-artifact"
          lipo -create -output "$RUNNER_TEMP/awseal-artifact/awseal" \
            "$RUNNER_TEMP/awseal-release/arm64-apple-macosx/release/awseal" \
            "$RUNNER_TEMP/awseal-release/x86_64-apple-macosx/release/awseal"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awseal-development-only
          path: ${{ runner.temp }}/awseal-artifact/awseal
          if-no-files-found: error
          retention-days: 5
